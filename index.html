<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive TV Box</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background-color: #181818; color: #e3e3e3; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 240px; background: #1e1e1e; padding: 16px; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; gap: 12px; }
    .logo { font-size: 18px; font-weight: bold; color: #8ab4f8; margin-bottom: 12px; }
    #main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .card { background: #252525; border-radius: 12px; padding: 12px; border: 1px solid #333; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; transition: 0.2s; }
    .card:hover { background: #2d2d2d; border-color: #8ab4f8; }
    .preview-box { height: 120px; background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; width: fit-content; }
    .badge-folder { background: #3c4043; color: #8ab4f8; }
    .badge-raw { background: #d32f2f; color: #fff; }
    .badge-jpg { background: #0b6bcb; color: #fff; }
    .badge-log { background: #2e7d32; color: #fff; }
    .raw-overlay { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); color: #ff5252; font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
    #status { font-size: 13px; color: #aaa; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="logo">📁 Drive TV Box</div>
    <div id="info" style="font-size: 12px; color: #888;">Carregando...</div>
  </div>

  <div id="main">
    <div id="status">Conectando diretamente à TV Box...</div>
    <div class="grid" id="gridContent"></div>
  </div>

  <script>
    // Conexão direta ao servidor
    const SERVIDOR_URL = 'http://hd-externo.mateus.mooo.com:2101/files/';

    async function carregarArquivos() {
      const statusEl = document.getElementById('status');
      const infoEl = document.getElementById('info');
      const gridEl = document.getElementById('gridContent');

      try {
        const response = await fetch(SERVIDOR_URL);
        
        if (!response.ok) {
          throw new Error(`Erro de resposta: ${response.status} ${response.statusText}`);
        }

        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const links = Array.from(doc.querySelectorAll('a'));

        const items = [];
        links.forEach(a => {
          let href = a.getAttribute('href');
          let name = a.innerText.trim() || href;

          if (!href || href === '#' || href.startsWith('javascript:') || href === '../' || name === 'Parent Directory') return;

          let isFolder = href.endsWith('/') || (!href.split('/').pop().includes('.') && !href.includes('?'));
          let cleanName = decodeURIComponent(href.split('/').filter(Boolean).pop() || name);
          let ext = isFolder ? 'folder' : (cleanName.split('.').pop().toLowerCase() || 'file');

          let fileUrl = href.startsWith('http') ? href : SERVIDOR_URL + href.replace(/^\//, '');

          items.push({ name: cleanName, url: fileUrl, isFolder: isFolder, ext: ext });
        });

        if (items.length === 0) {
          statusEl.innerText = 'Nenhum arquivo encontrado no diretório.';
          return;
        }

        statusEl.innerText = `Exibindo arquivos do HD Externo:`;
        infoEl.innerText = `${items.length} itens encontrados`;

        gridEl.innerHTML = items.map(item => {
          let badgeClass = 'badge-jpg';
          let badgeText = item.ext.toUpperCase();
          let isRaw = ['cr2', 'cr3', 'crm', 'nef', 'arw', 'dng'].includes(item.ext);
          let isImg = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(item.ext) || isRaw;
          let isLog = ['log', 'txt', 'cube', 'xml', 'json'].includes(item.ext);

          if (item.isFolder) { badgeClass = 'badge-folder'; badgeText = 'PASTA'; }
          else if (isRaw) { badgeClass = 'badge-raw'; }
          else if (isLog) { badgeClass = 'badge-log'; }

          let previewContent = item.isFolder 
            ? `<span style="font-size: 36px;">📁</span>`
            : (isImg 
                ? `<img src="${item.url}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span style="display:none; font-size:12px; color:#aaa;">📷 ${item.ext.toUpperCase()}</span>` 
                : `<span style="font-size: 28px;">📄</span>`);

          return `
            <a href="${item.url}" class="card" ${item.isFolder ? '' : 'target="_blank"'}>
              <div class="preview-box">${previewContent}${isRaw ? '<span class="raw-overlay">RAW</span>' : ''}</div>
              <div class="file-name" title="${item.name}">${item.name}</div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </a>`;
        }).join('');

      } catch (err) {
        statusEl.innerHTML = `
          <div style="background: #331f1f; color: #ff9999; padding: 16px; border-radius: 8px; border: 1px solid #772222;">
            <b>Erro ao carregar os arquivos:</b> ${err.message}<br><br>
            <span style="font-size:12px; color:#ddd;">
              <b>Se a página não carregar no GitHub Pages (HTTPS):</b><br>
              Clique no ícone de cadeado/configurações na barra do navegador (ao lado da URL do GitHub) > <b>Configurações do site</b> > Altere <b>Conteúdo Inseguro</b> para <b>Permitir</b>.
            </span>
          </div>`;
      }
    }

    window.onload = carregarArquivos;
  </script>
</body>
</html>
