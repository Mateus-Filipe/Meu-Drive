<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive TV Box - Windows Explorer Web</title>
  
  <!-- PDF.js para renderizar Miniaturas Reais de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { margin: 0; background-color: #191919; color: #e3e3e3; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 220px; background: #202020; padding: 16px; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .sidebar-btn { font-size: 14px; font-weight: 500; color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; transition: 0.2s; }
    .sidebar-btn:hover, .sidebar-btn.active { background: #2f2f2f; color: #8ab4f8; }
    .sidebar-section-title { margin-top: 12px; font-size: 11px; font-weight: bold; color: #777; text-transform: uppercase; letter-spacing: 0.5px; padding-left: 4px; }
    
    #main { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; position: relative; }
    
    /* Toolbar e Barra de Navegação Estilo Windows 11 */
    .address-bar-container { display: flex; align-items: center; gap: 8px; background: #252525; padding: 6px 12px; border-radius: 8px; border: 1px solid #333; }
    
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; background: #1e1e1e; padding: 6px 12px; border-radius: 6px; border: 1px solid #333; flex: 1; overflow-x: auto; }
    .crumb-item { color: #eee; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; transition: 0.2s; }
    .crumb-item:hover { background: #333; color: #8ab4f8; }
    .crumb-separator { color: #666; font-size: 11px; }

    .toolbar-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .btn-tool { background: #282828; color: #ccc; border: 1px solid #3d3d3d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-tool:hover { background: #333; color: #fff; border-color: #8ab4f8; }
    
    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: #2c2c2c; border: 1px solid #454545; border-radius: 8px; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 500; padding: 6px 0; font-size: 13px; }
    .dropdown-menu.show { display: block; }
    .dropdown-item { padding: 8px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #eee; }
    .dropdown-item:hover { background: #3a3a3a; }

    /* Exibição em Grid */
    .grid { display: grid; gap: 12px; }
    .grid.view-xl { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .grid.view-xl .preview-box { height: 160px; }
    .grid.view-lg { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .grid.view-lg .preview-box { height: 120px; }
    .grid.view-md { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .grid.view-md .preview-box { height: 90px; }
    .grid.view-sm { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    .grid.view-sm .preview-box { height: 60px; }

    .grid.view-list, .grid.view-details { display: flex; flex-direction: column; gap: 2px; }
    .grid.view-list .card, .grid.view-details .card { flex-direction: row; align-items: center; height: 38px; padding: 4px 12px; border-radius: 4px; }
    .grid.view-list .preview-box, .grid.view-details .preview-box { width: 24px; height: 24px; background: transparent; }

    .card { background: #222; border-radius: 8px; padding: 8px; border: 1px solid #2e2e2e; display: flex; flex-direction: column; gap: 6px; transition: 0.1s; cursor: pointer; position: relative; }
    .card:hover { background: #2a2a2a; border-color: #8ab4f8; }
    .card.selected { border-color: #8ab4f8; background: #2b394e; }
    .card.cut-mode { opacity: 0.4; border-style: dashed; }

    /* Efeitos de Arraste e Solte (Drag Target) */
    .drag-over-target { border: 2px dashed #8ab4f8 !important; background: #2f3e58 !important; }

    .preview-box { background: #141414; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; pointer-events: none; }
    .preview-box img, .preview-box video, .preview-box canvas { width: 100%; height: 100%; object-fit: cover; }
    
    .file-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
    .file-name[contenteditable="true"] { background: #000; border: 1px solid #8ab4f8; white-space: normal; }

    /* Menu de Contexto */
    #contextMenu { display: none; position: fixed; background: #2c2c2c; border: 1px solid #454545; border-radius: 8px; width: 220px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 1000; padding: 6px; font-size: 13px; }
    .menu-top-actions { display: flex; justify-content: space-around; border-bottom: 1px solid #3d3d3d; padding-bottom: 6px; margin-bottom: 6px; }
    .menu-top-btn { background: transparent; border: none; color: #eee; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 15px; }
    .menu-top-btn:hover { background: #3a3a3a; }
    .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 4px; cursor: pointer; color: #eee; }
    .menu-item:hover { background: #3a3a3a; }
    .menu-shortcut { color: #888; font-size: 11px; }
    .menu-divider { height: 1px; background: #3d3d3d; margin: 4px 0; }

    /* Modal Player de Vídeo */
    #videoModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    #videoModal video { max-width: 90vw; max-height: 80vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: #000; }
    .close-modal { position: absolute; top: 20px; right: 30px; font-size: 32px; color: #fff; cursor: pointer; }
  </style>
</head>
<body onclick="fecharMenus()" oncontextmenu="exibirContextMenuFundo(event)" onkeydown="tratarTeclas(event)">

  <div id="sidebar">
    <div class="sidebar-btn active" id="btnHome" onclick="resetarNavegacao()">💻 Este Computador</div>
    <div class="sidebar-btn" id="btnTrash" onclick="abrirLixeira()">🗑️ Lixeira</div>
    
    <!-- Seção de Favoritos -->
    <div class="sidebar-section-title">⭐ Favoritos</div>
    <div id="sidebarFavorites" style="display: flex; flex-direction: column; gap: 4px;"></div>

    <div id="info" style="font-size: 11px; color: #888; margin-top: auto; padding-top: 16px;">Pronto</div>
  </div>

  <div id="main">
    <!-- Barra Superior com Voltar e Navegação -->
    <div class="address-bar-container">
      <button id="btnVoltar" class="btn-tool" onclick="voltarPasta()">⬅ Voltar</button>
      <div id="breadcrumb" class="breadcrumb"></div>
    </div>

    <!-- Barra de Opções -->
    <div class="toolbar-actions" id="toolbarActions">
      <!-- Botão de Upload -->
      <button class="btn-tool" onclick="document.getElementById('fileUploadInput').click()" title="Fazer Upload de Arquivos">📤 Upload</button>
      <input type="file" id="fileUploadInput" multiple style="display:none;" onchange="fazerUpload(this.files)">

      <button class="btn-tool" id="btnEsvaziarLixeira" style="display:none; color: #ff6b6b;" onclick="esvaziarLixeiraDefinitivo()">🗑️ Esvaziar Lixeira</button>
      <div style="flex:1;"></div>

      <div class="dropdown">
        <button class="btn-tool" onclick="toggleDropdown(event, 'dropSort')">⇅ Classificar ▾</button>
        <div id="dropSort" class="dropdown-menu">
          <div class="dropdown-item" onclick="definirOrdenacao('name')">Nome</div>
          <div class="dropdown-item" onclick="definirOrdenacao('type')">Tipo</div>
          <div class="menu-divider"></div>
          <div class="dropdown-item" onclick="definirOrdem('asc')">Ordem Crescente</div>
          <div class="dropdown-item" onclick="definirOrdem('desc')">Ordem Decrescente</div>
        </div>
      </div>

      <div class="dropdown">
        <button class="btn-tool" onclick="toggleDropdown(event, 'dropView')">☰ Visualizar ▾</button>
        <div id="dropView" class="dropdown-menu">
          <div class="dropdown-item" onclick="definirVisualizacao('view-xl')">🔲 Ícones extra grandes</div>
          <div class="dropdown-item" onclick="definirVisualizacao('view-lg')">⏹ Ícones grandes</div>
          <div class="dropdown-item" onclick="definirVisualizacao('view-md')">◽ Ícones médios</div>
          <div class="dropdown-item" onclick="definirVisualizacao('view-sm')">▫ Ícones pequenos</div>
          <div class="menu-divider"></div>
          <div class="dropdown-item" onclick="definirVisualizacao('view-list')">☰ Lista</div>
          <div class="dropdown-item" onclick="definirVisualizacao('view-details')">📋 Detalhes</div>
        </div>
      </div>
    </div>

    <div id="status" style="font-size: 12px; color: #888;"></div>
    <div class="grid view-lg" id="gridContent"></div>
  </div>

  <!-- Player de Vídeo Modal -->
  <div id="videoModal">
    <span class="close-modal" onclick="fecharPlayerVideo()">✕</span>
    <h3 id="videoTitle" style="color: #fff; margin: 0;"></h3>
    <video id="mainVideoPlayer" controls autoplay></video>
  </div>

  <!-- Menu de Contexto -->
  <div id="contextMenu">
    <div class="menu-top-actions" id="menuTopActions">
      <button class="menu-top-btn" title="Recortar" onclick="recortarItem()">✂️</button>
      <button class="menu-top-btn" title="Copiar" onclick="copiarItem()">📋</button>
      <button class="menu-top-btn" title="Renomear" onclick="renomearSelecionado()">✏️</button>
      <button class="menu-top-btn" title="Excluir" onclick="deletarSelecionado()">🗑️</button>
    </div>
    <div class="menu-item" id="btnFavorito" onclick="toggleFavorito()">
      <span id="txtFavorito">⭐ Adicionar aos Favoritos</span>
    </div>
    <div class="menu-item" id="btnRestaurar" style="display:none;" onclick="restaurarItemLixeira()">
      <span>🔄 Restaurar</span>
    </div>
    <div class="menu-item" id="btnAbrir" onclick="abrirItemSelecionado()">
      <span>📂 Abrir</span>
      <span class="menu-shortcut">Enter</span>
    </div>
    <div class="menu-item" id="btnNovaAba" onclick="abrirNovaAba()">
      <span>↗️ Abrir em nova guia</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="btnColar" onclick="colarItem()">
      <span>📥 Colar</span>
      <span class="menu-shortcut">Ctrl+V</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" onclick="copiarLink()">
      <span>🔗 Copiar caminho</span>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const SERVIDOR_BASE = 'http://hd-externo.mateus.mooo.com:2101/files/';
    let pastaAtual = SERVIDOR_BASE;
    let emLixeira = false;
    let itemSelecionado = null;
    let itemTransferencia = null;
    let ordenacaoAtual = 'name';
    let ordemDirecao = 'asc';
    let listaArquivosAtual = [];

    // LocalStorage Getters/Setters
    function obterLixeira() { return JSON.parse(localStorage.getItem('lixeira_drive') || '[]'); }
    function salvarLixeira(itens) { localStorage.setItem('lixeira_drive', JSON.stringify(itens)); }
    function obterFavoritos() { return JSON.parse(localStorage.getItem('favoritos_drive') || '[]'); }
    function salvarFavoritos(favs) { localStorage.setItem('favoritos_drive', JSON.stringify(favs)); atualizarSidebarFavoritos(); }

    function toggleDropdown(e, id) {
      e.stopPropagation();
      fecharMenus();
      document.getElementById(id).classList.toggle('show');
    }

    function fecharMenus() {
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      document.getElementById('contextMenu').style.display = 'none';
    }

    function definirVisualizacao(modo) {
      document.getElementById('gridContent').className = `grid ${modo}`;
      fecharMenus();
    }

    function definirOrdenacao(criterio) {
      ordenacaoAtual = criterio;
      renderizarGrid();
      fecharMenus();
    }

    function definirOrdem(dir) {
      ordemDirecao = dir;
      renderizarGrid();
      fecharMenus();
    }

    async function carregarArquivos(targetUrl) {
      emLixeira = false;
      pastaAtual = targetUrl.endsWith('/') ? targetUrl : targetUrl + '/';
      itemSelecionado = null;
      atualizarSidebarActive('btnHome');
      document.getElementById('btnEsvaziarLixeira').style.display = 'none';
      document.getElementById('status').innerText = 'Carregando...';

      atualizarBreadcrumb();

      try {
        const response = await fetch(pastaAtual);
        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const links = Array.from(doc.querySelectorAll('a'));

        const lixeira = obterLixeira();
        listaArquivosAtual = [];

        const urlAtualObj = new URL(pastaAtual);
        const pathAtualCanonical = urlAtualObj.pathname;

        links.forEach(a => {
          let href = a.getAttribute('href');
          let name = a.innerText.trim() || href;
          if (!href || href === '#' || href === '../' || name === 'Parent Directory') return;

          let absoluteUrlObj = new URL(href, pastaAtual);
          let targetPath = absoluteUrlObj.pathname;

          if (!targetPath.startsWith(pathAtualCanonical) || targetPath === pathAtualCanonical) return;

          let relPath = targetPath.substring(pathAtualCanonical.length);
          let partes = relPath.split('/').filter(Boolean);
          if (partes.length > 1) return;

          let cleanName = decodeURIComponent(partes[0] || name);
          if (cleanName.toLowerCase() === 'files') return;

          let fullUrl = absoluteUrlObj.href;
          let isFolder = fullUrl.endsWith('/');
          let ext = isFolder ? 'folder' : (cleanName.split('.').pop().toLowerCase() || 'file');

          if (!lixeira.some(l => l.url === fullUrl)) {
            listaArquivosAtual.push({ name: cleanName, url: fullUrl, isFolder, ext, originalFolder: pastaAtual });
          }
        });

        document.getElementById('status').innerText = '';
        renderizarGrid();
      } catch (err) {
        document.getElementById('status').innerText = 'Erro de conexão: ' + err.message;
      }
    }

    /* SISTEMA DE UPLOAD MULTI-MÉTODO */
    async function fazerUpload(files, destino = pastaAtual) {
      if (!files || files.length === 0) return;
      let target = destino.endsWith('/') ? destino : destino + '/';
      
      for (let i = 0; i < files.length; i++) {
        let file = files[i];
        document.getElementById('status').innerText = `Enviando (${i+1}/${files.length}): ${file.name}...`;
        let enviouSucesso = false;

        // Tentativa 1: POST via Form-Data (Requisitado por servidores Android)
        try {
          let formData = new FormData();
          formData.append('file', file, file.name);
          let res = await fetch(target, { method: 'POST', body: formData });
          if (res.ok) enviouSucesso = true;
        } catch (e) {
          console.warn('POST falhou, tentando PUT...', e);
        }

        // Tentativa 2: PUT Direto
        if (!enviouSucesso) {
          try {
            let uploadUrl = target + encodeURIComponent(file.name);
            let res = await fetch(uploadUrl, { method: 'PUT', body: file });
            if (res.ok) enviouSucesso = true;
          } catch (err) {
            console.error('Erro no upload PUT:', err);
          }
        }
      }
      document.getElementById('status').innerText = 'Upload concluído!';
      setTimeout(() => carregarArquivos(pastaAtual), 1000);
    }

    /* ARRASTAR E SOLTAR (DRAG & DROP) ENTRE PASTAS */
    function iniciarDragItem(e, url, isFolder, name) {
      e.dataTransfer.setData('text/plain', JSON.stringify({ url, isFolder, name }));
      e.dataTransfer.effectAllowed = 'move';
    }

    function permitirDropPasta(e, el) {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drag-over-target');
    }

    function sairDropPasta(e, el) {
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove('drag-over-target');
    }

    async function soltarEmPasta(e, targetPastaUrl, el) {
      e.preventDefault();
      e.stopPropagation();
      if (el) el.classList.remove('drag-over-target');

      // Se for arquivo vindo do PC
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fazerUpload(e.dataTransfer.files, targetPastaUrl);
        return;
      }

      const rawData = e.dataTransfer.getData('text/plain');
      if (!rawData) return;

      try {
        const data = JSON.parse(rawData);
        if (!data.url || data.url === targetPastaUrl) return;

        let targetDir = targetPastaUrl.endsWith('/') ? targetPastaUrl : targetPastaUrl + '/';
        let destUrl = targetDir + encodeURIComponent(data.name) + (data.isFolder ? '/' : '');

        document.getElementById('status').innerText = `Movendo ${data.name}...`;

        await fetch(data.url, {
          method: 'MOVE',
          headers: { 'Destination': destUrl }
        });

        document.getElementById('status').innerText = 'Item movido!';
        carregarArquivos(pastaAtual);
      } catch(err) {
        document.getElementById('status').innerText = 'Aviso: O app servidor da TV Box não aceita o comando de mover arquivos (MOVE).';
      }
    }

    /* FAVORITOS */
    function toggleFavorito() {
      if (!itemSelecionado) return;
      let favs = obterFavoritos();
      let idx = favs.findIndex(f => f.url === itemSelecionado.url);
      
      if (idx >= 0) {
        favs.splice(idx, 1);
      } else {
        favs.push({
          name: itemSelecionado.name,
          url: itemSelecionado.url,
          isFolder: itemSelecionado.isFolder,
          ext: itemSelecionado.isFolder ? 'folder' : itemSelecionado.name.split('.').pop().toLowerCase()
        });
      }
      salvarFavoritos(favs);
      fecharMenus();
    }

    function atualizarSidebarFavoritos() {
      const container = document.getElementById('sidebarFavorites');
      if (!container) return;
      let favs = obterFavoritos();

      if (favs.length === 0) {
        container.innerHTML = '<div style="font-size: 11px; color: #555; padding: 4px 8px;">Nenhum favorito</div>';
        return;
      }

      container.innerHTML = favs.map(f => {
        let icon = f.isFolder ? '📁' : '📄';
        return `
          <div class="sidebar-btn" title="${f.name}" onclick="executarAbrir('${f.url}', ${f.isFolder}, '${f.name}')">
            <span>${icon}</span>
            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;">${f.name}</span>
          </div>`;
      }).join('');
    }

    function abrirLixeira() {
      emLixeira = true;
      itemSelecionado = null;
      atualizarSidebarActive('btnTrash');
      document.getElementById('btnEsvaziarLixeira').style.display = 'inline-flex';
      
      listaArquivosAtual = obterLixeira();
      atualizarBreadcrumbLixeira();
      renderizarGrid();
    }

    function atualizarSidebarActive(id) {
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      const activeEl = document.getElementById(id);
      if (activeEl) activeEl.classList.add('active');
    }

    function atualizarBreadcrumb() {
      const breadcrumb = document.getElementById('breadcrumb');
      const pathClean = pastaAtual.replace(SERVIDOR_BASE, '');
      const partes = pathClean.split('/').filter(Boolean);

      let html = `<div class="crumb-item" onclick="carregarArquivos('${SERVIDOR_BASE}')" ondragover="permitirDropPasta(event, this)" ondragleave="sairDropPasta(event, this)" ondrop="soltarEmPasta(event, '${SERVIDOR_BASE}', this)">💻 Este Computador</div>`;
      let urlAcumulada = SERVIDOR_BASE;

      partes.forEach((p) => {
        if (p.toLowerCase() === 'files') return;
        urlAcumulada += p + '/';
        let target = urlAcumulada;
        html += `<span class="crumb-separator">❯</span>`;
        html += `<div class="crumb-item" onclick="carregarArquivos('${target}')" ondragover="permitirDropPasta(event, this)" ondragleave="sairDropPasta(event, this)" ondrop="soltarEmPasta(event, '${target}', this)">${decodeURIComponent(p)}</div>`;
      });

      breadcrumb.innerHTML = html;
    }

    function atualizarBreadcrumbLixeira() {
      document.getElementById('breadcrumb').innerHTML = `
        <div class="crumb-item">💻 Este Computador</div>
        <span class="crumb-separator">❯</span>
        <div class="crumb-item" style="color:#8ab4f8;">🗑️ Lixeira</div>
      `;
    }

    function voltarPasta() {
      if (emLixeira) {
        carregarArquivos(SERVIDOR_BASE);
        return;
      }
      if (pastaAtual === SERVIDOR_BASE) return;
      let partes = pastaAtual.replace(/\/$/, '').split('/');
      partes.pop();
      let novaUrl = partes.join('/') + '/';
      if (novaUrl.length >= SERVIDOR_BASE.length) {
        carregarArquivos(novaUrl);
      }
    }

    function renderizarGrid() {
      const gridEl = document.getElementById('gridContent');
      
      listaArquivosAtual.sort((a, b) => {
        if (a.isFolder && !b.isFolder) return -1;
        if (!a.isFolder && b.isFolder) return 1;
        let res = a.name.localeCompare(b.name);
        return ordemDirecao === 'asc' ? res : -res;
      });

      gridEl.innerHTML = listaArquivosAtual.map((item, idx) => {
        let isVid = ['mp4', 'mkv', 'webm', 'mov', 'avi'].includes(item.ext);
        let isImg = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(item.ext);
        let isPdf = item.ext === 'pdf';
        let isDoc = ['doc', 'docx'].includes(item.ext);
        let isXls = ['xls', 'xlsx'].includes(item.ext);
        let isPpt = ['ppt', 'pptx'].includes(item.ext);

        let icon = '📄';
        if (item.isFolder) icon = '📁';
        else if (isPdf) icon = '📕';
        else if (isDoc) icon = '📘';
        else if (isXls) icon = '📗';
        else if (isPpt) icon = '📙';

        let dragDropPastaAttrs = item.isFolder 
          ? `ondragover="permitirDropPasta(event, this)" ondragleave="sairDropPasta(event, this)" ondrop="soltarEmPasta(event, '${item.url}', this)"` 
          : '';

        return `
          <div class="card" id="card-${idx}" draggable="true" 
               ondragstart="iniciarDragItem(event, '${item.url}', ${item.isFolder}, '${item.name}')"
               ${dragDropPastaAttrs}
               onclick="selecionarCard(event, '${item.url}', ${item.isFolder}, '${item.name}', this)"
               ondblclick="executarAbrir('${item.url}', ${item.isFolder}, '${item.name}')"
               oncontextmenu="exibirContextMenuCard(event, '${item.url}', ${item.isFolder}, '${item.name}', this)">
            <div class="preview-box" id="prev-${idx}">
              ${isImg ? `<img src="${item.url}" loading="lazy">` : ''}
              ${isVid ? `<video src="${item.url}" preload="metadata"></video>` : ''}
              ${!isImg && !isVid ? `<span style="font-size:32px">${icon}</span>` : ''}
            </div>
            <div class="file-name" id="name-${idx}" ondblclick="ativarEdicaoNome(event, this, '${item.url}', '${item.name}')">${item.name}</div>
          </div>`;
      }).join('');

      listaArquivosAtual.forEach((item, idx) => {
        if (item.ext === 'pdf') renderizarThumbnailPDF(item.url, `prev-${idx}`);
      });
    }

    async function renderizarThumbnailPDF(url, elementId) {
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 0.3 });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        const box = document.getElementById(elementId);
        if (box) { box.innerHTML = ''; box.appendChild(canvas); }
      } catch (e) {}
    }

    function selecionarCard(e, url, isFolder, name, cardEl) {
      if (e) e.stopPropagation();
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      cardEl.classList.add('selected');
      itemSelecionado = { url, isFolder, name, el: cardEl };
    }

    function abrirPlayerVideo(url, title) {
      const modal = document.getElementById('videoModal');
      const player = document.getElementById('mainVideoPlayer');
      document.getElementById('videoTitle').innerText = title;
      player.src = url;
      modal.style.display = 'flex';
    }

    function fecharPlayerVideo() {
      const modal = document.getElementById('videoModal');
      const player = document.getElementById('mainVideoPlayer');
      player.pause();
      player.src = '';
      modal.style.display = 'none';
    }

    function executarAbrir(url, isFolder, name) {
      if (emLixeira) return;
      let ext = name ? name.split('.').pop().toLowerCase() : '';
      let isVid = ['mp4', 'mkv', 'webm', 'mov', 'avi'].includes(ext);

      if (isFolder) carregarArquivos(url);
      else if (isVid) abrirPlayerVideo(url, name);
      else window.open(url, '_blank');
    }

    function abrirItemSelecionado() {
      if (itemSelecionado) executarAbrir(itemSelecionado.url, itemSelecionado.isFolder, itemSelecionado.name);
    }

    function exibirContextMenuCard(e, url, isFolder, name, cardEl) {
      e.preventDefault();
      e.stopPropagation();
      selecionarCard(e, url, isFolder, name, cardEl);
      abrirContextMenu(e.clientX, e.clientY, true);
    }

    function exibirContextMenuFundo(e) {
      e.preventDefault();
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      itemSelecionado = null;
      abrirContextMenu(e.clientX, e.clientY, false);
    }

    function abrirContextMenu(x, y, sobreCard) {
      const menu = document.getElementById('contextMenu');
      document.getElementById('menuTopActions').style.display = sobreCard ? 'flex' : 'none';
      document.getElementById('btnAbrir').style.display = (sobreCard && !emLixeira) ? 'flex' : 'none';
      document.getElementById('btnNovaAba').style.display = (sobreCard && !emLixeira) ? 'flex' : 'none';
      document.getElementById('btnRestaurar').style.display = (sobreCard && emLixeira) ? 'flex' : 'none';
      
      let favs = obterFavoritos();
      let ehFav = itemSelecionado && favs.some(f => f.url === itemSelecionado.url);
      document.getElementById('txtFavorito').innerText = ehFav ? '❌ Remover dos Favoritos' : '⭐ Adicionar aos Favoritos';
      document.getElementById('btnFavorito').style.display = (sobreCard && !emLixeira) ? 'flex' : 'none';

      menu.style.display = 'block';
      menu.style.left = `${Math.min(x, window.innerWidth - 230)}px`;
      menu.style.top = `${Math.min(y, window.innerHeight - 200)}px`;
    }

    function recortarItem() {
      if (!itemSelecionado || emLixeira) return;
      itemTransferencia = { ...itemSelecionado, action: 'cut' };
      itemSelecionado.el.classList.add('cut-mode');
    }

    function copiarItem() {
      if (!itemSelecionado || emLixeira) return;
      itemTransferencia = { ...itemSelecionado, action: 'copy' };
    }

    async function colarItem() {
      if (!itemTransferencia || emLixeira) return;
      let destinoUrl = pastaAtual + encodeURIComponent(itemTransferencia.name);
      try {
        await fetch(itemTransferencia.url, {
          method: itemTransferencia.action === 'cut' ? 'MOVE' : 'COPY',
          headers: { 'Destination': destinoUrl }
        });
        carregarArquivos(pastaAtual);
      } catch {
        alert('Operação não suportada diretamente pelo navegador.');
      }
    }

    function deletarSelecionado() {
      if (!itemSelecionado) return;
      
      if (emLixeira) {
        if (confirm(`Excluir definitivamente "${itemSelecionado.name}"?`)) {
          let lixeira = obterLixeira().filter(i => i.url !== itemSelecionado.url);
          salvarLixeira(lixeira);
          abrirLixeira();
        }
      } else {
        let lixeira = obterLixeira();
        let ext = itemSelecionado.isFolder ? 'folder' : itemSelecionado.name.split('.').pop().toLowerCase();
        lixeira.push({
          name: itemSelecionado.name,
          url: itemSelecionado.url,
          isFolder: itemSelecionado.isFolder,
          ext: ext,
          originalFolder: pastaAtual
        });
        salvarLixeira(lixeira);
        carregarArquivos(pastaAtual);
      }
    }

    function restaurarItemLixeira() {
      if (!itemSelecionado || !emLixeira) return;
      let lixeira = obterLixeira().filter(i => i.url !== itemSelecionado.url);
      salvarLixeira(lixeira);
      abrirLixeira();
    }

    function esvaziarLixeiraDefinitivo() {
      if (confirm('Tem certeza que deseja esvaziar a lixeira permanentemente?')) {
        salvarLixeira([]);
        abrirLixeira();
      }
    }

    function renomearSelecionado() {
      if (!itemSelecionado || emLixeira) return;
      const nameEl = itemSelecionado.el.querySelector('.file-name');
      ativarEdicaoNome(null, nameEl, itemSelecionado.url, itemSelecionado.name);
    }

    function ativarEdicaoNome(e, el, urlAntiga, nomeAntigo) {
      if (e) e.stopPropagation();
      if (emLixeira) return;
      el.setAttribute('contenteditable', 'true');
      el.focus();
      el.onblur = async () => {
        el.setAttribute('contenteditable', 'false');
        let novoNome = el.innerText.trim();
        if (novoNome && novoNome !== nomeAntigo) {
          let urlNova = urlAntiga.replace(encodeURIComponent(nomeAntigo), encodeURIComponent(novoNome));
          await fetch(urlAntiga, { method: 'MOVE', headers: { 'Destination': urlNova } });
          carregarArquivos(pastaAtual);
        }
      };
    }

    function tratarTeclas(e) {
      if (e.key === 'Delete' && itemSelecionado) deletarSelecionado();
      if (e.key === 'Escape') fecharPlayerVideo();
    }

    function abrirNovaAba() { if (itemSelecionado && !emLixeira) window.open(itemSelecionado.url, '_blank'); }
    function copiarLink() { if (itemSelecionado) navigator.clipboard.writeText(itemSelecionado.url); }
    function resetarNavegacao() { carregarArquivos(SERVIDOR_BASE); }

    // Eventos Globais de Drag and Drop para Upload de Arquivos
    window.onload = () => {
      atualizarSidebarFavoritos();
      carregarArquivos(SERVIDOR_BASE);

      const mainEl = document.getElementById('main');
      mainEl.addEventListener('dragover', (e) => e.preventDefault());
      mainEl.addEventListener('drop', (e) => {
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          e.preventDefault();
          fazerUpload(e.dataTransfer.files, pastaAtual);
        }
      });
    };
  </script>
</body>
</html>
