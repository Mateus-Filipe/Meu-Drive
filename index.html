<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Arquivos - TV Box</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #191919;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* BANDEIRA LATERAL (SIDEBAR) */
        .sidebar {
            width: 220px;
            background-color: #202020;
            border-right: 1px solid #2d2d2d;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: #cccccc;
            font-size: 14px;
        }

        .menu-item:hover, .menu-item.active {
            background-color: #2d2d2d;
            color: #ffffff;
        }

        .secao-titulo {
            font-size: 11px;
            color: #888888;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            padding-left: 10px;
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }

        /* BARRA DE FERRAMENTAS SUPERIOR */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background-color: #202020;
            border-bottom: 1px solid #2d2d2d;
        }

        .btn {
            background-color: #2d2d2d;
            color: #ffffff;
            border: 1px solid #3d3d3d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #3d3d3d;
            border-color: #5d5d5d;
        }

        .breadcrumb {
            flex: 1;
            background-color: #181818;
            border: 1px solid #2d2d2d;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #aaaaaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ÁREA DE EXIBIÇÃO DAS PASTAS/ARQUIVOS */
        .grid-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            grid-auto-rows: 110px;
            gap: 15px;
        }

        .card-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 8px;
            background-color: transparent;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .card-item:hover {
            background-color: #2d2d2d;
        }

        .card-item .icone {
            font-size: 40px;
            margin-bottom: 6px;
        }

        .card-item .nome {
            font-size: 12px;
            color: #dddddd;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .mensagem-status {
            grid-column: 1 / -1;
            color: #888888;
            font-size: 14px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <div class="sidebar">
        <div class="menu-item active" onclick="carregarArquivos('')">
            💻 Este Computador
        </div>
        <div class="menu-item">
            🗑️ Lixeira
        </div>

        <div class="secao-titulo">FAVORITOS</div>
        <div style="font-size: 12px; color: #666; padding-left: 10px;">Nenhum favorito</div>
    </div>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-content">
        <!-- BARRA SUPERIOR -->
        <div class="toolbar">
            <button class="btn" onclick="voltar()">← Voltar</button>
            <div class="breadcrumb" id="breadcrumb">💻 Este Computador</div>
            
            <button class="btn" onclick="document.getElementById('file-input').click()">
                📤 Upload
            </button>
            <input type="file" id="file-input" style="display: none;" onchange="enviarArquivo(this.files)">
        </div>

        <!-- REGRID DE ARQUIVOS/PASTAS -->
        <div class="grid-container" id="grid-arquivos">
            <div class="mensagem-status">Conectando à TV Box...</div>
        </div>
    </div>

    <script>
        // ================= CONFIGURAÇÃO DO SEU IP =================
        const IP_PONTE = "192.168.15.26";  // <--- DIGITE O IP DO SEU CELULAR/PC (ONDE RODA O PYDROID 3)
        const PORTA_PONTE = "2101";
        // ==========================================================

        let caminhoAtual = "";

        function getBaseUrl() {
            return `http://${IP_PONTE}:${PORTA_PONTE}`;
        }

        // 📂 BUSCAR E EXIBIR ARQUIVOS DA TV BOX
        async function carregarArquivos(caminho = '') {
            caminhoAtual = caminho;
            atualizarBreadcrumb();

            const grid = document.getElementById('grid-arquivos');
            grid.innerHTML = '<div class="mensagem-status">Carregando conteúdo...</div>';

            try {
                const resposta = await fetch(`${getBaseUrl()}/${caminho}`);
                const resultado = await resposta.json();

                if (resultado.status === "sucesso") {
                    grid.innerHTML = '';

                    if (!resultado.dados || resultado.dados.length === 0) {
                        grid.innerHTML = '<div class="mensagem-status">Esta pasta está vazia.</div>';
                        return;
                    }

                    resultado.dados.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card-item';

                        const icone = item.isDir ? '📁' : '📄';
                        card.innerHTML = `
                            <div class="icone">${icone}</div>
                            <div class="nome" title="${item.nome}">${item.nome}</div>
                        `;

                        // Clique na pasta para entrar
                        if (item.isDir) {
                            card.onclick = () => {
                                const novoCaminho = caminhoAtual 
                                    ? `${caminhoAtual}/${item.nome}` 
                                    : item.nome;
                                carregarArquivos(novoCaminho);
                            };
                        }

                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = `<div class="mensagem-status" style="color: #ff5555;">Erro: ${resultado.mensagem}</div>`;
                }
            } catch (erro) {
                grid.innerHTML = `<div class="mensagem-status" style="color: #ff5555;">Erro de conexão com a Ponte Python!<br>Verifique se o Pydroid 3 está rodando no IP ${IP_PONTE}.</div>`;
            }
        }

        // ⬅️ BOTÃO VOLTAR PASTA
        function voltar() {
            if (!caminhoAtual) return;
            const partes = caminhoAtual.split('/');
            partes.pop();
            carregarArquivos(partes.join('/'));
        }

        // 📌 ATUALIZAR BARRA DE ENDEREÇO
        function atualizarBreadcrumb() {
            const el = document.getElementById('breadcrumb');
            if (!caminhoAtual) {
                el.innerText = '💻 Este Computador';
            } else {
                el.innerText = `💻 Este Computador / ${caminhoAtual.replace(/\//g, ' / ')}`;
            }
        }

        // 📤 ENVIAR ARQUIVO (UPLOAD HTTP PUT ➔ FTP STOR)
        async function enviarArquivo(files) {
            if (!files || files.length === 0) return;

            const arquivo = files[0];
            const destinoUrl = caminhoAtual 
                ? `${getBaseUrl()}/${caminhoAtual}/${arquivo.name}` 
                : `${getBaseUrl()}/${arquivo.name}`;

            const grid = document.getElementById('grid-arquivos');
            grid.innerHTML = `<div class="mensagem-status">Enviando "${arquivo.name}" para o HD da TV Box...</div>`;

            try {
                const resposta = await fetch(destinoUrl, {
                    method: 'PUT',
                    body: arquivo
                });

                if (resposta.ok) {
                    alert('✅ Upload concluído com sucesso!');
                    carregarArquivos(caminhoAtual);
                } else {
                    alert('❌ Falha ao enviar o arquivo.');
                    carregarArquivos(caminhoAtual);
                }
            } catch (erro) {
                alert('❌ Erro na ponte de upload: ' + erro.message);
                carregarArquivos(caminhoAtual);
            }
            
            document.getElementById('file-input').value = '';
        }

        // Inicia carregando o diretório raiz ao abrir a página
        window.onload = () => carregarArquivos('');
    </script>
</body>
</html>
