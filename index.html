<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive TV Box</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background-color: #181818; color: #e3e3e3; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 240px; background: #1e1e1e; padding: 16px; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; gap: 12px; }
    .logo { font-size: 18px; font-weight: bold; color: #8ab4f8; margin-bottom: 12px; cursor: pointer; }
    #main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    
    /* Topo & Controles */
    .top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; background: #222; padding: 10px 16px; border-radius: 8px; border: 1px solid #333; }
    .nav-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-back { background: #3c4043; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-back:hover { background: #5f6368; }
    
    /* Breadcrumbs Estilo Windows */
    .breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #aaa; flex-wrap: wrap; }
    .crumb-item { color: #8ab4f8; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .crumb-item:hover { background: #333; text-decoration: underline; }
    .crumb-sep { color: #666; }

    /* Seletor de Tamanho */
    .size-controls { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
    .btn-size { background: #2d2d2d; color: #ccc; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .btn-size.active { background: #8ab4f8; color: #000; font-weight: bold; border-color: #8ab4f8; }

    /* Grid com tamanhos dinâmicos */
    .grid { display: grid; gap: 16px; }
    .grid.size-sm { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .grid.size-md { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .grid.size-lg { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

    .grid.size-sm .preview-box { height: 80px; }
    .grid.size-md .preview-box { height: 120px; }
    .grid.size-lg .preview-box { height: 160px; }

    .card { background: #252525; border-radius: 12px; padding: 12px; border: 1px solid #333; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; transition: 0.2s; cursor: pointer; }
    .card:hover { background: #2d2d2d; border-color: #8ab4f8; }
    .preview-box { background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .preview-box img, .preview-box video { width: 100%; height: 100%; object-fit: cover; }
    .file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Badges de extensão */
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; width: fit-content; }
    .badge-folder { background: #3c4043; color: #8ab4f8; }
    .badge-raw { background: #d32f2f; color: #fff; }
    .badge-jpg { background: #0b6bcb; color: #fff; }
    .badge-video { background: #9c27b0; color: #fff; }
    .badge-pdf { background: #e53935; color: #fff; }
    .badge-doc { background: #1565c0; color: #fff; }
    .badge-xls { background: #2e7d32; color: #fff; }
    .badge-ppt { background: #d84315; color: #fff; }
    .badge-file { background: #616161; color: #fff; }
    
    #status { font-size: 12px; color: #888; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="logo" onclick="resetarNavegacao()">📁 Drive TV Box</div>
    <div id="info" style="font-size: 12px; color: #888;">Carregando...</div>
  </div>

  <div id="main">
    <div class="top-bar">
      <div class="nav-bar">
        <button id="btnVoltar" class="btn-back" onclick="voltarPasta()">⬅ Voltar</button>
        <div id="breadcrumb" class="breadcrumb"></div>
      </div>
      <div class="size-controls">
        <span>Tamanho:</span>
        <button class="btn-size" onclick="alterarTamanho('sm', this)">P</button>
        <button class="btn-size active" onclick="alterarTamanho('md', this)">M</button>
        <button class="btn-size" onclick="alterarTamanho('lg', this)">G</button>
      </div>
    </div>
    <div id="status">Conectando...</div>
    <div class="grid size-md" id="gridContent"></div>
  </div>

  <script>
    const SERVIDOR_BASE = 'http://hd-externo.mateus.mooo.com:2101/files/';
    let historicoPastas = [];
    let pastaAtual = SERVIDOR_BASE;

    function alterarTamanho(tamanho, btn) {
      const grid = document.getElementById('gridContent');
      grid.className = `grid size-${tamanho}`;
      document.querySelectorAll('.btn-size').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function atualizarBreadcrumb(targetUrl) {
      const breadcrumbEl = document.getElementById('breadcrumb');
      let caminhoRelativo = targetUrl.replace(SERVIDOR_BASE, '');
      let partes = caminhoRelativo.split('/').filter(Boolean);
      
      let html = `<span class="crumb-item" onclick="navegarParaCaminho('${SERVIDOR_BASE}')">Início</span>`;
      let urlAcumulada = SERVIDOR_BASE;

      partes.forEach((parte, index) => {
        urlAcumulada += encodeURIComponent(parte) + '/';
        let nomeLimpo = decodeURIComponent(parte);
        html += `<span class="crumb-sep">></span>`;
        html += `<span class="crumb-item" onclick="navegarParaCaminho('${urlAcumulada}')">${nomeLimpo}</span>`;
      });

      breadcrumbEl.innerHTML = html;
    }

    function navegarParaCaminho(url) {
      historicoPastas.push(pastaAtual);
      carregarArquivos(url);
    }

    async function carregarArquivos(targetUrl) {
      const statusEl = document.getElementById('status');
      const infoEl = document.getElementById('info');
      const gridEl = document.getElementById('gridContent');
      const btnVoltar = document.getElementById('btnVoltar');

      pastaAtual = targetUrl;
      btnVoltar.style.display = historicoPastas.length > 0 ? 'block' : 'none';
      atualizarBreadcrumb(targetUrl);

      statusEl.innerText = 'Carregando arquivos...';
      gridEl.innerHTML = '';

      try {
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error(`Status ${response.status}`);

        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const links = Array.from(doc.querySelectorAll('a'));

        const items = [];
        links.forEach(a => {
          let href = a.getAttribute('href');
          let name = a.innerText.trim() || href;

          if (!href || href === '#' || href.startsWith('javascript:') || href === '../' || name === 'Parent Directory' || name === 'Home') return;

          let isFolder = href.endsWith('/') || (!href.split('/').pop().includes('.') && !href.includes('?'));
          let cleanName = decodeURIComponent(href.split('/').filter(Boolean).pop() || name);
          let ext = isFolder ? 'folder' : (cleanName.split('.').pop().toLowerCase() || 'file');

          let fullUrl = href.startsWith('http') ? href : new URL(href, targetUrl).href;

          items.push({ name: cleanName, url: fullUrl, isFolder: isFolder, ext: ext });
        });

        if (items.length === 0) {
          statusEl.innerText = 'Pasta vazia.';
          infoEl.innerText = '0 itens';
          return;
        }

        statusEl.innerText = '';
        infoEl.innerText = `${items.length} itens`;

        gridEl.innerHTML = items.map(item => {
          let badgeClass = 'badge-file';
          let badgeText = item.ext.toUpperCase();
          
          let isRaw = ['cr2', 'cr3', 'crm', 'nef', 'arw', 'dng'].includes(item.ext);
          let isImg = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(item.ext) || isRaw;
          let isVid = ['mp4', 'mkv', 'webm', 'avi', 'mov'].includes(item.ext);
          let isPdf = item.ext === 'pdf';
          let isDoc = ['doc', 'docx'].includes(item.ext);
          let isXls = ['xls', 'xlsx', 'csv'].includes(item.ext);
          let isPpt = ['ppt', 'pptx'].includes(item.ext);

          if (item.isFolder) { badgeClass = 'badge-folder'; badgeText = 'PASTA'; }
          else if (isRaw) { badgeClass = 'badge-raw'; }
          else if (isVid) { badgeClass = 'badge-video'; }
          else if (isPdf) { badgeClass = 'badge-pdf'; }
          else if (isDoc) { badgeClass = 'badge-doc'; }
          else if (isXls) { badgeClass = 'badge-xls'; }
          else if (isPpt) { badgeClass = 'badge-ppt'; }
          else if (isImg) { badgeClass = 'badge-jpg'; }

          let previewContent = '';
          if (item.isFolder) {
            previewContent = `<span style="font-size: 36px;">📁</span>`;
          } else if (isVid) {
            previewContent = `<video src="${item.url}" preload="metadata" muted></video>`;
          } else if (isImg) {
            previewContent = `<img src="${item.url}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span style="display:none; font-size:12px; color:#aaa;">📷 ${item.ext.toUpperCase()}</span>`;
          } else if (isPdf) {
            previewContent = `<span style="font-size: 32px;">📕</span>`;
          } else if (isDoc) {
            previewContent = `<span style="font-size: 32px;">📘</span>`;
          } else if (isXls) {
            previewContent = `<span style="font-size: 32px;">📗</span>`;
          } else if (isPpt) {
            previewContent = `<span style="font-size: 32px;">📙</span>`;
          } else {
            previewContent = `<span style="font-size: 28px;">📄</span>`;
          }

          if (item.isFolder) {
            return `
              <div class="card" onclick="abrirPasta('${item.url}')">
                <div class="preview-box">${previewContent}</div>
                <div class="file-name" title="${item.name}">${item.name}</div>
                <span class="badge ${badgeClass}">${badgeText}</span>
              </div>`;
          } else {
            return `
              <a href="${item.url}" target="_blank" class="card">
                <div class="preview-box">${previewContent}</div>
                <div class="file-name" title="${item.name}">${item.name}</div>
                <span class="badge ${badgeClass}">${badgeText}</span>
              </a>`;
          }
        }).join('');

      } catch (err) {
        statusEl.innerHTML = `<b style="color: #ff8888;">Erro ao acessar:</b> ${err.message}`;
      }
    }

    function abrirPasta(novaUrl) {
      historicoPastas.push(pastaAtual);
      carregarArquivos(novaUrl);
    }

    function voltarPasta() {
      if (historicoPastas.length > 0) {
        const pastaAnterior = historicoPastas.pop();
        carregarArquivos(pastaAnterior);
      }
    }

    function resetarNavegacao() {
      historicoPastas = [];
      carregarArquivos(SERVIDOR_BASE);
    }

    window.onload = () => carregarArquivos(SERVIDOR_BASE);
  </script>
</body>
</html>
